name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show errors on summary page
        if: failure()
        run: |
          grep -E "^e: " build.log | head -25 | while IFS= read -r l; do echo "::error::${l}"; done
          grep -A6 "What went wrong" build.log | head -12 | while IFS= read -r l; do echo "::error::${l}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
