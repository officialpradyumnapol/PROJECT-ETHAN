name: Unzip Project
on: workflow_dispatch
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No ZIP found"; exit 1; fi
          mkdir /tmp/keep && cp "$ZIP" /tmp/keep/p.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -o /tmp/keep/p.zip -x ".github/*" -d .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace with Android app" || echo "Nothing to commit"
          git push
